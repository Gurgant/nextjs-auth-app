packages:
  - "."

ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - "@tailwindcss/oxide"
  - prisma
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - esbuild

# Security floors for transitive dependencies whose parents pin vulnerable
# versions (checked with `pnpm audit --prod`). Each range stays inside the
# major the parent expects; drop an entry once its parent ships the fix.
overrides:
  "postcss@<8.5.23": "8.5.23" # next pins 8.4.31
  "nanoid@<3.3.18": "^3.3.18" # via postcss
  "sharp@<0.35.4": "^0.35.4" # next optional dep; next allows ^0.35.4
  "browserslist@<4.28.7": "^4.28.7"
  "@babel/core@<7.29.6": "^7.29.6" # jest toolchain
  "defu@<6.1.5": "^6.1.5" # prisma > @prisma/config > c12
  "deepmerge-ts@<8.0.0": "^8.0.2" # @prisma/config pins 7.1.5
  # Dev toolchain only (eslint, jest/jsdom, tailwind oxide) — never shipped,
  # but kept patched so `pnpm audit` stays clean.
  "tar@<7.5.22": "^7.5.22"
  "minimatch@>=3.0.0 <3.1.5": "^3.1.5"
  "minimatch@>=9.0.0 <9.0.9": "^9.0.9"
  "brace-expansion@>=1.0.0 <1.1.21": "^1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "^2.1.7"
  "js-yaml@>=3.0.0 <3.15.2": "^3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  "flatted@<3.4.4": "^3.4.4"
  "picomatch@>=2.0.0 <2.3.2": "^2.3.2"
  "picomatch@>=4.0.0 <4.0.7": "^4.0.7"
  "ws@>=8.0.0 <8.21.3": "^8.21.3"
  "glob@>=10.0.0 <10.5.0": "^10.5.0"
  "ajv@>=6.0.0 <6.15.0": "^6.15.0"
  "@humanfs/node@<0.16.8": "^0.16.8"
