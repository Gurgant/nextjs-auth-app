name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI-only values, shared by both jobs; nothing here is a real secret.
  DATABASE_URL: postgresql://postgres:postgres123@127.0.0.1:5433/nextjs_auth_db
  AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuv
  NEXTAUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuv
  NEXTAUTH_URL: http://localhost:3000
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

jobs:
  # Both jobs are pinned to ubuntu-24.04, not ubuntu-latest: the pinned
  # Playwright has no browser build for a newer image, so the runner is
  # upgraded on purpose, together with Playwright.
  checks:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: nextjs_auth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5 # version comes from packageManager in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Key parity of the five message files; the pre-commit hook runs the
      # same script, but a hook can be skipped.
      - name: Validate translations
        run: pnpm validate-translations

      - name: Push schema to the test database
        run: pnpm prisma:push

      - name: Test (Jest — unit + integration)
        run: pnpm test

      - name: Build
        run: pnpm build

      # Server-only code (auth config, repositories, Prisma) must never reach
      # the browser: a Client Component importing a server module bundles it.
      - name: No server code in client bundles
        run: |
          if grep -rlE "registerFailedLogin|timing-equalizer-not-a-password|PrismaClient" .next/static; then
            echo "::error::server-only code found in client chunks (files above)"
            exit 1
          fi

  # The Playwright suite, in a real browser against `next dev` and its own
  # PostgreSQL. Playwright test retries are off (playwright.config.ts) and the
  # helpers retry no request: a test that fails once fails the job.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: nextjs_auth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5 # version comes from packageManager in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Push schema to the test database
        run: pnpm prisma:push

      - name: Test (Playwright — end-to-end)
        run: pnpm test:e2e

      - name: Upload traces, screenshots and videos of failed tests
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
