services:
  # Development database (host port 5432 — override with POSTGRES_DEV_PORT if taken)
  postgres_dev:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_DEV_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: nextjs_auth_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test database, kept separate so tests never touch dev data
  # (host port 5433 — override with POSTGRES_TEST_PORT if taken)
  postgres_test:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: nextjs_auth_db
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
  postgres_test_data:
    driver: local
